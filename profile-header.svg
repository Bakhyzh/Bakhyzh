<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="78%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#06224f"/>
      <stop offset="50%" stop-color="#020f26"/>
      <stop offset="100%" stop-color="#00060f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e7bff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e7bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a9bff"/>
      <stop offset="100%" stop-color="#0a4fd6"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bcd6ff"/>
    </linearGradient>
    <path id="p1" d="M1000 180 H900 Q880 180 880 160 V110 Q880 100 870 100 H800"/>
    <path id="p2" d="M1000 180 H940 Q920 180 920 200 V250 Q920 260 910 260 H820"/>
    <path id="p3" d="M1000 180 H1080 Q1100 180 1100 160 V110 Q1100 100 1110 100 H1180"/>
    <path id="p4" d="M1000 180 H1060 Q1080 180 1080 200 V250 Q1080 260 1090 260 H1170"/>
  </defs>

  <style>
    .ring { fill: none; stroke: #6ea8ff; stroke-width: 1.2; transform-origin: 1000px 180px; animation: pulse 6s ease-out infinite; }
    .r2 { animation-delay: 2s; }
    .r3 { animation-delay: 4s; }
    @keyframes pulse {
      0%   { transform: scale(0.35); opacity: 0.0; }
      15%  { opacity: 0.35; }
      100% { transform: scale(1.5);  opacity: 0; }
    }
    .coin { transform-origin: 1000px 180px; animation: float 5s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .glow { transform-origin: 1000px 180px; animation: breathe 5s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
    .phrase { opacity: 0; animation: show 9s linear infinite; }
    .ph2 { animation-delay: 3s; }
    .ph3 { animation-delay: 6s; }
    @keyframes show {
      0%   { opacity: 0; transform: translateY(8px); }
      4%   { opacity: 1; transform: translateY(0); }
      29%  { opacity: 1; transform: translateY(0); }
      33%  { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; }
    }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .ring, .coin, .glow, .phrase, .cursor { animation: none; }
      .ph1 { opacity: 1; }
    }
  </style>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- pulsing rings -->
  <circle class="ring" cx="1000" cy="180" r="170"/>
  <circle class="ring r2" cx="1000" cy="180" r="170"/>
  <circle class="ring r3" cx="1000" cy="180" r="170"/>

  <!-- traces -->
  <g fill="none" stroke="#3b6cc9" stroke-opacity="0.35" stroke-width="1.6" stroke-linecap="round">
    <use href="#p1"/><use href="#p2"/><use href="#p3"/><use href="#p4"/>
  </g>
  <g fill="#4d86ff" fill-opacity="0.8">
    <circle cx="800" cy="100" r="3"/><circle cx="820" cy="260" r="3"/>
    <circle cx="1180" cy="100" r="3"/><circle cx="1170" cy="260" r="3"/>
  </g>

  <!-- travelling pulses (money moving along the traces) -->
  <g fill="#8cc4ff">
    <circle r="4"><animateMotion dur="3.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#p1"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3.8s" begin="0.8s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3.5s" begin="1.4s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="4.1s" begin="0.3s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#p4"/></animateMotion></circle>
  </g>

  <!-- coin -->
  <circle class="glow" cx="1000" cy="180" r="120" fill="url(#glow)"/>
  <g class="coin">
    <circle cx="1000" cy="180" r="52" fill="#0b1220" stroke="#2c3a55" stroke-width="1.5"/>
    <circle cx="1000" cy="180" r="42" fill="url(#coin)"/>
    <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M983 168 H1017 M1008 159 L1017 168 L1008 177"/>
      <path d="M1017 192 H983 M992 183 L983 192 L992 201"/>
    </g>
  </g>

  <!-- text -->
  <g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="80" y="150" font-size="78" font-weight="700" fill="url(#name)" letter-spacing="-1">Bakhyt</text>
    <text x="82" y="200" font-size="28" font-weight="400" fill="#9aa4b5">Java backend developer</text>

    <text x="82" y="262" font-size="26" font-weight="400" fill="#6f7d95">I care about</text>
    <g font-size="26" font-weight="600" fill="#4d9bff">
      <text class="phrase ph1" x="248" y="262">money that never gets lost</text>
      <text class="phrase ph2" x="248" y="262">concurrency without deadlocks</text>
      <text class="phrase ph3" x="248" y="262">events that never get lost</text>
    </g>
    <rect class="cursor" x="82" y="290" width="14" height="3" fill="#4d9bff"/>
  </g>
</svg>
